apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: xpu-vllm-

components:
  - ../../../../../recipes/modelserver/components/images/xpu-vllm

# Use the Intel catalog image for the vLLM XPU deployment.
images:
  - name: ghcr.io/llm-d/llm-d-xpu
    newName: amr-registry.caas.intel.com/aiops/catalog/vllm
    newTag: latest

labels:
  - pairs:
      llm-d.ai/model: Qwen3-8B
      llm-d.ai/guide: tiered-prefix-cache
      llm-d.ai/accelerator-variant: xpu
      llm-d.ai/accelerator-vendor: intel
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
