apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: tiered-prefix-cache-intel-claim-template-decode
spec:
  spec:
    devices:
      requests:
        # Single-replica LMCache run: claim 4 Intel GPUs without pinning to a
        # fixed PCI quartet so the scheduler can use any available Intel GPUs.
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            allocationMode: ExactCount
            count: 4
