apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: xpu-decode-claim
  labels:
    llm-d.ai/role: decode
spec:
  spec:
    devices:
      requests:
        - name: intel
          exactly:
            deviceClassName: gpu.intel.com
            allocationMode: ExactCount
            count: 1
            #selectors:
            #  - cel:
            #      expression: >-
            #        device.attributes["gpu.intel.com"].pciAddress in
            #        ["0000:3c:00.0"]
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: xpu-prefill-claim
  labels:
    llm-d.ai/role: prefill
spec:
  spec:
    devices:
      requests:
        - name: intel
          exactly:
            deviceClassName: gpu.intel.com
            count: 1
            allocationMode: ExactCount
            #selectors:
            #  - cel:
            #      expression: >-
            #        device.attributes["gpu.intel.com"].pciAddress in
            #        ["0000:40:00.0"]
